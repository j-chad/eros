services:
  caddy:
    image: eros-caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./admin-build:/srv/admin
      - ./client-build:/srv/client
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: eros-backend:latest
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data/db:/data/db
      - ./data/files:/data/files
    environment:
      - DATABASE_PATH=/data/db/eros.sqlite
      - FILE_STORAGE_LOCAL_BASE_PATH=/data/files
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=https://admin.eros.jacksonc.dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
